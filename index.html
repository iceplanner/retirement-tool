<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วางแผนเกษียณของคุณ | วางแผนเกษียณ</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
}

.header {
  text-align: center;
  padding: 40px 20px 10px;
}

.header h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

.header p {
  color: #94a3b8;
}

.container {
  max-width: 720px;
  margin: auto;
  background: #111827;
  padding: 25px;
  border-radius: 16px;
}

label { margin-top: 10px; display: block; }

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 16px;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  margin-top: 20px;
}

.result { margin-top: 25px; line-height: 1.7; }

.box {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-top: 12px;
}

.highlight { color:#22c55e; font-weight:bold; }
.warning { color:#f87171; font-weight:bold; }

.badge { padding:6px 10px; border-radius:999px; font-size:13px; font-weight:bold; display:inline-block; margin-top:6px; }
.badge.red { background:#7f1d1d; color:#fecaca; }
.badge.yellow { background:#78350f; color:#fde68a; }
.badge.green { background:#064e3b; color:#6ee7b7; }

.footer {
  text-align:center;
  margin-top:30px;
  font-size:14px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="header">
  <h1>เริ่มวางแผนเกษียณ วันนี้เลย!</h1>
  <p>คำนวณแผนเกษียณของคุณภายใน 1 นาที</p>
</div>

<div class="container">

<label>อายุปัจจุบัน</label>
<input type="text" id="age" oninput="formatNumberInput(this)" placeholder="เช่น 25">

<label>อายุที่ต้องการเกษียณ</label>
<input type="text" id="retireAge" oninput="formatNumberInput(this)" placeholder="เช่น 60">

<label>คาดว่าอายุยืนถึง</label>
<input type="text" id="lifeExpect" oninput="formatNumberInput(this)" placeholder="เช่น 90">

<label>รายได้ต่อเดือน(ในปัจจุบัน)</label>
<input type="text" id="income" oninput="formatNumberInput(this)" placeholder="เช่น 50,000">

<label>เงินที่ต้องการใช้หลังเกษียณ/เดือน</label>
<input type="text" id="expense" oninput="formatNumberInput(this)" placeholder="เช่น 30,000">

<label>เงินเก็บที่มีอยู่แล้ว</label>
<input type="text" id="current" oninput="formatNumberInput(this)" placeholder="เช่น 200,000">

<label>ตั้งใจจะเก็บเงินหรือลงทุนต่อเดือน</label>
<input type="text" id="annualInvest" oninput="formatNumberInput(this)" placeholder="เช่น 8,000">

<label>คาดการณ์ผลตอบแทนต่อปี (%)</label>
<input type="number" id="rate" placeholder="ไม่ใส่ = 0%">

<button onclick="calculate()">🔥 ดูแผนเกษียณของฉันทันที</button>

<div class="result" id="result"></div>

</div>

<div class="footer">
Ice Supakarn | นักวางแผนการเงิน<br>
ช่วยคุณวางแผนเกษียณแบบมีระบบ
</div>

<script>
function formatNumberInput(el){
  let value = el.value.replace(/,/g,'');
  if(!isNaN(value) && value !== ''){
    el.value = parseInt(value).toLocaleString('en-US');
  }
}

function getNumber(id){
  return parseFloat(document.getElementById(id).value.replace(/,/g,'')) || 0;
}

function calculate(){
  let age = getNumber('age');
  let retireAge = getNumber('retireAge');
  let lifeExpect = getNumber('lifeExpect');
  let income = getNumber('income');
  let expense = getNumber('expense');
  let current = getNumber('current');
  let monthlyInvest = getNumber('annualInvest');

  let rateInput = parseFloat(document.getElementById('rate').value);
  let rate = isNaN(rateInput) ? 0 : rateInput/100;

  let years = retireAge - age;
  let retirementYears = lifeExpect - retireAge;

  if(years <= 0 || retirementYears <= 0){
    alert('ข้อมูลไม่ถูกต้อง');
    return;
  }

  let totalNeeded = expense * 12 * retirementYears;

  let fvCurrent = current * Math.pow(1+rate, years);

  let monthlyRate = rate/12;
  let months = years*12;

  let fvMonthly = rate === 0
    ? monthlyInvest * months
    : monthlyInvest * ((Math.pow(1+monthlyRate, months)-1)/monthlyRate);

  let totalFuture = fvCurrent + fvMonthly;
  let gap = totalNeeded - totalFuture;

  let pmtNeeded = rate === 0
    ? (totalNeeded - fvCurrent)/months
    : (totalNeeded - fvCurrent) * monthlyRate / (Math.pow(1+monthlyRate,months)-1);

  if(pmtNeeded < 0) pmtNeeded = 0;

  let additional = Math.max(pmtNeeded - monthlyInvest, 0);
  let excess = Math.max(monthlyInvest - pmtNeeded, 0);

  let percent = Math.round((pmtNeeded/(income||1))*100);
  let badgeClass = percent > 30 ? 'red' : (percent >= 15 ? 'yellow' : 'green');
  let badgeText = percent > 30 ? '🔴 เสี่ยง' : (percent >= 15 ? '🟡 ต้องปรับ' : '🟢 ดี');

  document.getElementById('result').innerHTML = `
  <div class="box">ต้องมีเงิน <span class="highlight">${totalNeeded.toLocaleString()}</span></div>
  <div class="box">คุณจะมี <span class="highlight">${Math.round(totalFuture).toLocaleString()}</span> <span style="color:#94a3b8; font-size:13px;">(ผลจากเงินเก็บ/ลงทุนรายเดือนและเงินที่คุณมีอยู่แล้ว)</span></div>
  <div class="box">${gap >= 0
    ? `❗ ขาดอีก <span class="warning">${Math.round(gap).toLocaleString()}</span>`
    : `✅ เกินเป้า <span class="highlight">+${Math.round(Math.abs(gap)).toLocaleString()}</span>`}
  </div>

  <div class="box">
  👉 ต้องลงทุน <span class="highlight">${Math.round(pmtNeeded).toLocaleString()}</span> / เดือน 
  <span style="color:#94a3b8; font-size:13px;">(${percent}% ของรายได้)</span>
  <div class="badge ${badgeClass}">${badgeText}</div>
  <br>
  ${gap >= 0
    ? `❗ ยังขาดอีก <span class="warning">${Math.round(additional).toLocaleString()}</span> / เดือน`
    : `🟢 คุณลงทุนเกินเป้ามา <span class="highlight">+${Math.round(excess).toLocaleString()}</span> / เดือน`}
  </div>

  <div class="box">
  ${gap <= 0
    ? `✨ ตอนนี้คุณมาถูกทางแล้ว แต่ยังมีวิธีที่ทำให้คุณใช้เงินน้อยลง หรือเกษียณได้เร็วขึ้นกว่านี้อีก ให้ผมช่วยวางแผนให้เหมาะกับคุณแบบเฉพาะตัว เพื่อพาคุณไปให้ถึงเป้าหมายที่ใจคุณต้องการ`
    : `⚠️ หากคุณยังไม่เริ่มวางแผนตั้งแต่วันนี้ ตัวเลขนี้มีโอกาสเพิ่มขึ้นเรื่อย ๆ ทุก 1 ปีที่คุณช้า ภาระต่อเดือนอาจเพิ่มขึ้นอีกหลายพันบาท ให้ผมช่วยคุณตามหาแผนเกษียณที่เหมาะกับคุณ และวางแผนให้คุณไปถึงเป้าหมายได้ง่ายขึ้น`
  }
  </div>

  <button onclick="contact()">🔥 วางแผนเกษียณแบบใช้ได้จริง 🔥<br><span style="font-size:14px; opacity:0.9;">(ปรึกษาฟรี 15 นาที)</span></button>
  `;
}
function contact(){
  let age = getNumber('age');
  let retireAge = getNumber('retireAge');
  let lifeExpect = getNumber('lifeExpect');
  let income = getNumber('income');
  let expense = getNumber('expense');
  let current = getNumber('current');
  let monthlyInvest = getNumber('annualInvest');

  let rateInput = parseFloat(document.getElementById('rate').value);
  let rate = isNaN(rateInput) ? 0 : rateInput/100;

  let years = retireAge - age;
  let retirementYears = lifeExpect - retireAge;

  let totalNeeded = expense * 12 * retirementYears;
  let fvCurrent = current * Math.pow(1+rate, years);
  let monthlyRate = rate/12;
  let months = years*12;

  let fvMonthly = rate === 0
    ? monthlyInvest * months
    : monthlyInvest * ((Math.pow(1+monthlyRate, months)-1)/monthlyRate);

  let totalFuture = fvCurrent + fvMonthly;
  let gap = totalNeeded - totalFuture;

  let pmtNeeded = rate === 0
    ? (totalNeeded - fvCurrent)/months
    : (totalNeeded - fvCurrent) * monthlyRate / (Math.pow(1+monthlyRate,months)-1);

  let additional = Math.max(pmtNeeded - monthlyInvest, 0);

  let message = gap >= 0
    ? `ผมมี gap เกษียณ ${Math.round(gap).toLocaleString()} บาท และต้องเพิ่มเงินลงทุนอีก ${Math.round(additional).toLocaleString()} บาท/เดือน อยากให้ช่วยวางแผนให้ตรงจุดครับ`
    : `ตอนนี้ผมเกินเป้า ${Math.round(Math.abs(gap)).toLocaleString()} บาท และอยากปรับแผนให้เหมาะสมยิ่งขึ้นครับ`;

  window.location.href = `https://line.me/R/ti/p/@icetw?text=${encodeURIComponent(message)}`;
  
}

</script>

</body>
</html>
